<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#17181c" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" />
  <title>ProDraw</title>
</head>
<body>
  <div id="app" class="workspace">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">P</span><span>ProDraw</span></div>
      <nav class="file-actions" data-i18n-aria-label="group.document">
        <button id="new-document" data-i18n="action.new"></button>
        <button id="open-document" data-i18n="action.open"></button>
        <button id="save-document" data-i18n="action.save"></button>
        <button id="save-document-as" data-i18n="action.saveAs"></button>
        <button id="export-png" data-i18n="action.export"></button>
      </nav>
      <nav class="history-actions" data-i18n-aria-label="group.history">
        <button id="undo" data-i18n-title="action.undo" class="icon-button">↶</button>
        <button id="redo" data-i18n-title="action.redo" class="icon-button">↷</button>
      </nav>
      <nav id="drawing-tool-panel" class="tool-actions floating-tool-panel" data-i18n-aria-label="group.tools">
        <button id="move-tool-panel" class="tool-panel-grip" data-i18n-title="panel.move">⠿</button>
        <button id="tool-brush" class="selected" data-i18n="tool.brush"></button>
        <button id="tool-eraser" data-i18n="tool.eraser"></button>
        <button id="tool-smudge" data-i18n="tool.smudge"></button>
      </nav>
      <nav class="view-actions" data-i18n-aria-label="group.view">
        <button id="view-rotate-left" data-i18n-title="view.rotateLeft" class="icon-button">↺</button>
        <button id="view-fit" data-i18n="view.fit"></button>
        <button id="view-rotate-right" data-i18n-title="view.rotateRight" class="icon-button">↻</button>
      </nav>
    </header>

    <aside class="brush-controls panel">
      <button id="open-brushes" class="brush-chip">
        <span class="brush-dot"></span><span id="active-brush-name"></span>
      </button>
      <label><span data-i18n="brush.size"></span><output id="brush-size-value"></output>
        <input id="brush-size" type="range" min="1" max="500" value="24" />
      </label>
      <label><span id="brush-opacity-label" data-i18n="brush.opacity"></span><output id="brush-opacity-value"></output>
        <input id="brush-opacity" type="range" min="1" max="100" value="100" />
      </label>
      <label class="color-control"><span data-i18n="brush.color"></span>
        <input id="brush-color" type="color" value="#171717" />
      </label>
      <label class="finger-paint-control"><span data-i18n="input.fingerPaint"></span>
        <input id="finger-paint" type="checkbox" /></label>
    </aside>

    <main class="canvas-shell"><canvas id="paint-canvas"></canvas></main>

    <aside class="layers-panel panel">
      <header><strong data-i18n="layers.title"></strong>
        <button id="add-layer" data-i18n-title="layers.add" class="icon-button">＋</button>
      </header>
      <div id="layer-list" class="layer-list"></div>
    </aside>

    <footer class="statusbar">
      <span id="document-status"></span><span id="view-status"></span>
    </footer>
  </div>

  <dialog id="new-document-dialog" class="modal new-document-dialog">
    <form method="dialog">
      <header><h2 data-i18n="new.title"></h2><button value="cancel" class="icon-button">×</button></header>
      <div id="preset-list" class="preset-list"></div>
      <fieldset><legend data-i18n="new.custom"></legend>
        <label><span data-i18n="new.width"></span><input id="custom-width" type="number" min="1" max="8192" value="1920" /></label>
        <label><span data-i18n="new.height"></span><input id="custom-height" type="number" min="1" max="8192" value="1080" /></label>
        <label><span data-i18n="new.dpi"></span><input id="custom-dpi" type="number" min="1" max="1200" value="72" /></label>
      </fieldset>
      <p id="new-error" class="dialog-error" role="alert"></p>
      <footer><button value="cancel" data-i18n="action.cancel"></button>
        <button id="create-document" value="default" data-i18n="action.create" class="primary"></button></footer>
    </form>
  </dialog>

  <dialog id="brush-library-dialog" class="modal brush-library-dialog">
    <form method="dialog"><header><h2 data-i18n="brush.library"></h2>
      <span><button id="add-brush" type="button" data-i18n-title="brush.add" class="icon-button">＋</button>
        <button id="add-brush-set" type="button" data-i18n-title="brush.addSet" class="icon-button">▣＋</button>
        <button id="import-brush" type="button" data-i18n-title="brush.import" class="icon-button">⇩</button>
        <button id="export-brush" type="button" data-i18n-title="brush.export" class="icon-button">⇧</button>
        <button id="reset-brush" type="button" data-i18n-title="brush.reset" class="icon-button">↺</button>
        <button id="restore-brush-trash" type="button" data-i18n-title="brush.restoreTrash" class="icon-button">♲</button>
        <button id="reveal-brush-folder" type="button" data-i18n-title="brush.revealFolder" class="icon-button">⌂</button>
        <button value="cancel" class="icon-button">×</button></span></header>
      <div class="brush-library-body"><nav id="brush-set-list"></nav>
        <div id="brush-list" class="brush-list"></div></div>
      <div id="brush-context-menu" class="context-menu" hidden>
        <button type="button" data-action="favorite"></button>
        <button type="button" data-action="duplicate" data-i18n="brush.duplicate"></button>
        <button type="button" data-action="delete" data-i18n="brush.delete"></button>
      </div>
      <div id="brush-set-context-menu" class="context-menu" hidden>
        <button type="button" data-action="rename" data-i18n="brush.rename"></button>
        <button type="button" data-action="delete" data-i18n="brush.deleteSet"></button>
      </div>
    </form>
  </dialog>

  <dialog id="brush-studio-dialog" class="modal brush-studio-dialog">
    <form method="dialog"><header><div><small data-i18n="studio.title"></small>
      <h2 id="studio-brush-name"></h2></div><span>
      <button id="studio-cancel" value="cancel" data-i18n="action.cancel"></button>
      <button id="studio-apply" type="button" class="primary" data-i18n="action.apply"></button>
    </span></header>
    <div class="brush-studio-body">
      <nav id="studio-sections"></nav>
      <section id="studio-controls" class="studio-controls"></section>
      <aside class="drawing-pad"><header data-i18n="studio.drawingPad"></header>
        <canvas id="studio-pad"></canvas><div id="stylus-diagnostics" class="stylus-diagnostics"></div>
        <div class="stylus-trace-actions"><button id="trace-record" type="button"></button>
          <button id="trace-save" type="button"></button></div>
      </aside>
    </div></form>
  </dialog>

  <dialog id="brush-source-dialog" class="modal brush-source-dialog">
    <form method="dialog"><header><h2 data-i18n="source.library"></h2>
      <button value="cancel" data-i18n="action.cancel"></button></header>
      <nav><button id="source-tab-shape" type="button" data-i18n="source.shape"></button>
        <button id="source-tab-grain" type="button" data-i18n="source.grain"></button></nav>
      <div id="brush-source-grid" class="brush-source-grid"></div>
    </form>
  </dialog>

  <dialog id="delete-brush-dialog" class="modal confirm-dialog">
    <form method="dialog"><h2 data-i18n="brush.deleteTitle"></h2>
      <p id="delete-brush-message"></p><footer>
        <button value="cancel" data-i18n="action.cancel"></button>
        <button id="confirm-delete-brush" type="button" class="danger" data-i18n="brush.delete"></button>
      </footer></form>
  </dialog>

  <dialog id="brush-set-dialog" class="modal confirm-dialog">
    <form method="dialog"><h2 id="brush-set-dialog-title" data-i18n="brush.newSetTitle"></h2>
      <label class="studio-control"><span data-i18n="brush.setName"></span>
        <input id="brush-set-name" type="text" maxlength="80" /></label>
      <p id="brush-set-error" class="dialog-error"></p><footer>
        <button value="cancel" data-i18n="action.cancel"></button>
        <button id="create-brush-set" type="button" class="primary" data-i18n="action.create"></button>
      </footer></form>
  </dialog>

  <dialog id="delete-brush-set-dialog" class="modal confirm-dialog">
    <form method="dialog"><h2 data-i18n="brush.deleteSetTitle"></h2>
      <p id="delete-brush-set-message"></p><footer>
        <button value="cancel" data-i18n="action.cancel"></button>
        <button id="confirm-delete-brush-set" type="button" class="danger" data-i18n="brush.deleteSet"></button>
      </footer></form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
